name: vetau_app
description: Ứng dụng quản lý vé tàu - Hệ thống đặt vé tàu Việt Nam
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client - gọi API Backend .NET Core
  dio: ^5.4.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.5

  # Local Storage (JWT token, session id, my bookings)
  shared_preferences: ^2.3.0

  # Date/Number Formatting (tiếng Việt)
  intl: ^0.19.0

  # Google Fonts - Nunito Sans typography
  google_fonts: ^6.2.1

  # SVG Support
  flutter_svg: ^2.0.10+1

  # QR Code display (hiển thị QR thanh toán)
  qr_flutter: ^4.1.0

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Cached Network Image
  cached_network_image: ^3.3.1

  # Lottie animation (empty states, success)
  lottie: ^3.1.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

